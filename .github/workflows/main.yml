name: Build, Release, and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: 📝 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  release:
    name: Create GitHub release
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: 📝 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🚀 Run semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    name: Build and push backend
    needs: [changes, release]
    if: needs.changes.outputs.backend == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Checkout code
        uses: actions/checkout@v7

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏷️ Extract backend image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend_knowledge-spaces
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.published == 'true' }}

      - name: 🔓 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  build-frontend:
    name: Build and push frontend
    needs: [changes, release]
    if: needs.changes.outputs.frontend == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Checkout code
        uses: actions/checkout@v7

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏷️ Extract frontend image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/frontend_knowledge-spaces
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.published == 'true' }}

      - name: 🔓 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
